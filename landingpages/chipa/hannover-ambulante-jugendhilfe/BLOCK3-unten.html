<!-- ===== STICKY MOBILE CTA ===== -->
<div class="stickybar" id="stickybar">
  <a href="#bewerben" class="cta">Jetzt in 2 Minuten bewerben &#8594;</a>
</div>
<script>
(function(){
  var root=document.getElementById('lp-top'),bar=document.getElementById('stickybar'),form=document.getElementById('bewerben');
  if(!root||!bar||!form)return;
  root.classList.add('js-on');
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(e){bar.style.display=e[0].isIntersecting?'none':'';},{threshold:0}).observe(form);
  }
})();
</script>

<!-- Zahlen beim Zaehlen nicht springen lassen -->
<style>#lp-top .stats .n{font-variant-numeric:tabular-nums}</style>

<!-- ===== ZAHLEN HOCHZAEHLEN (Count-up) =====
  Zwei Dinge, die vorher schiefgingen:
  1) Die Backslashes in den Regexen waren verlorengegangen: aus dem Ziffern-Kuerzel wurde
     /(d+)/ und suchte den BUCHSTABEN d. Deshalb hier ueberall [0-9] --
     dieses Skript enthaelt bewusst KEINEN einzigen Backslash.
  2) Der IntersectionObserver hat auf dieser Seite nicht ausgeloest. Getriggert
     wird jetzt ueber getBoundingClientRect() am scroll-Event -- das laeuft in
     jedem Browser und ueberlebt auch Caching- und Optimierungs-Plugins.
  Ausserdem werden die Zahlen erst in dem Moment auf 0 gesetzt, in dem die
  Animation wirklich startet. Faellt das Skript aus, stehen einfach die
  richtigen Zahlen da -- nie wieder drei Nullen.
=========================================================================== -->
<script>
(function(){
  var list=Array.prototype.slice.call(document.querySelectorAll('#lp-top .stats .n'));
  if(!list.length)return;
  var started=false;

  /* Zielwerte sichern, Anzeige aber NICHT anfassen. */
  list.forEach(function(el){ el.setAttribute('data-n',el.textContent.trim()); });

  function animate(el){
    var raw=el.getAttribute('data-n')||'';
    var m=raw.match(/[0-9]+/);
    if(!m){ el.textContent=raw; return; }
    var digits=m[0];
    var at=raw.indexOf(digits);
    var prefix=raw.slice(0,at);          /* z.B. "" */
    var suffix=raw.slice(at+digits.length); /* z.B. "+" bei "85+" */
    var target=parseInt(digits,10);
    var dur=1400,t0=null;
    el.textContent=prefix+'0'+suffix;
    function tick(ts){
      if(t0===null)t0=ts;
      var p=Math.min((ts-t0)/dur,1), eased=1-Math.pow(1-p,3);
      el.textContent=prefix+Math.round(eased*target)+suffix;
      if(p<1){ requestAnimationFrame(tick); } else { el.textContent=raw; }
    }
    requestAnimationFrame(tick);
  }

  function start(){
    if(started)return;
    started=true;
    window.removeEventListener('scroll',check);
    window.removeEventListener('resize',check);
    list.forEach(animate);
  }

  function visible(el){
    var r=el.getBoundingClientRect();
    var h=window.innerHeight||document.documentElement.clientHeight;
    return r.bottom>0 && r.top<h-40;
  }

  function check(){ if(visible(list[0])) start(); }

  if(!('requestAnimationFrame' in window)){ return; } /* Zahlen bleiben stehen */

  window.addEventListener('scroll',check,{passive:true});
  window.addEventListener('resize',check,{passive:true});
  check();                       /* Abschnitt schon sichtbar? dann sofort */
  setTimeout(check,600);         /* nach spaetem Layout/Webfont nochmal */

  /* Zum Testen in der Browser-Konsole: chipaCountUp() */
  window.chipaCountUp=function(){ started=false; start(); };
})();
</script>
